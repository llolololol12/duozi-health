      <stop offset="0" stop-color="#F3F9F6"/>
      <stop offset="1" stop-color="#E0EFE9"/>
    </linearGradient>
    
<linearGradient id="body" x1="0" y1="0" x2="0.9" y2="1">
  <stop offset="0" stop-color="#0E7C66"/>
  <stop offset="1" stop-color="#0A5A4C"/>
</linearGradient>
    
<linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0A5A4C"/>
  <stop offset="1" stop-color="#06332B"/>
</linearGradient>
    
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
  <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#06332B" flood-opacity="0.18"/>
</filter>
  </defs>
